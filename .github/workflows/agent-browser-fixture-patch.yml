name: Agent browser fixture patch

on:
  push:
    branches:
      - agent/v0.2.0-beui-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - name: Update stale browser schema assertion and self-delete
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/spec06_frontend_browser.rs")
          text = path.read_text()
          old = 'assert_eq!(ledger.schema_version().expect("browser schema version"), 7);'
          new = 'assert_eq!(ledger.schema_version().expect("browser schema version"), 9);'
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale schema assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/agent-browser-fixture-patch.yml").unlink()
          Path(".github/agent-browser-fixture-patch.trigger").unlink(missing_ok=True)
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/spec06_frontend_browser.rs .github/workflows/agent-browser-fixture-patch.yml .github/agent-browser-fixture-patch.trigger
          git diff --cached --check
          git commit -m "test(browser): align fixture with schema v9"
          git push origin HEAD:agent/v0.2.0-beui-redesign
