name: Bootstrap 0.2.6 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    name: Create v0.2.6 tag and dispatch release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          frontend_version="$(node -p "require('./frontend/package.json').version")"
          if [[ "$cargo_version" != "0.2.6" || "$frontend_version" != "0.2.6" ]]; then
            echo "Expected Cargo and frontend version 0.2.6, got cargo=$cargo_version frontend=$frontend_version" >&2
            exit 1
          fi

      - name: Create stable release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.6"
          git fetch --tags --force
          existing="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              git tag -f "$tag" "$GITHUB_SHA"
              git push --force origin "refs/tags/$tag"
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch validated release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; no dispatch needed."
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
