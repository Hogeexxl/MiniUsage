name: Windows Tray Gate

on:
  push:
    branches:
      - codex/windows-tray-panel
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/main.rs
      - src/windows_shell.rs
      - assets/windows/tray-icon.png
      - tests/distribution_release_guard.rs
      - .github/workflows/windows-tray-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate-a:
    name: Gate A - Windows Shell
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run focused Windows tray tests
        shell: pwsh
        run: cargo test --locked --bin mini-usage t_wintray_

      - name: Check Windows binary
        shell: pwsh
        run: cargo check --locked --bin mini-usage

      - name: Run distribution release guard
        shell: pwsh
        run: cargo test --locked --test distribution_release_guard

  gate-a1:
    name: Gate A.1 - Windows distribution EXE
    needs: gate-a
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run launcher integration
        shell: pwsh
        run: cargo test --locked --test distribution_launcher_integration

      - name: Run runtime integration
        shell: pwsh
        run: cargo test --locked --test distribution_runtime_integration
