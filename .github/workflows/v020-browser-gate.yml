name: v0.2.0 browser-only gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Use runner Chrome for this gate
        shell: python
        run: |
          from pathlib import Path
          config = Path("frontend/playwright.config.ts")
          text = config.read_text()
          needle = '    browserName: "chromium",\n'
          if text.count(needle) != 1:
              raise SystemExit("unexpected Playwright config")
          config.write_text(text.replace(needle, needle + '    channel: "chrome",\n', 1))
      - name: Run formal browser gate
        working-directory: frontend
        run: npm run test:browser:gate
