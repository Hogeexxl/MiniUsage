name: One-time Rust Format

on:
  push:
    branches:
      - codex/windows-tray-panel
    paths:
      - .github/workflows/windows-tray-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/windows-tray-panel

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Format Rust and guard scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              src/main.rs|src/windows_shell.rs) ;;
              *)
                echo "cargo fmt changed out-of-scope file: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

      - name: Commit formatting and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/windows-tray-format.yml
          git add src/main.rs src/windows_shell.rs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format Windows tray Rust code [skip ci]'
          git push origin HEAD:codex/windows-tray-panel
