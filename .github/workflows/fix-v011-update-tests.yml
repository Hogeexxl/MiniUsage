name: Fix v0.1.1 update test versions

on:
  push:
    branches:
      - release/v0.1.1

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: fix v0.1.1 update test versions' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Make update tests derive versions from CARGO_PKG_VERSION
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/update/mod.rs')
          text = p.read_text(encoding='utf-8')
          old = '''    #[tokio::test]\n    async fn t_dist_007_newer_equal_and_older_matrix() {\n        for (latest, expected_available) in [\n            (Version::new(0, 1, 1), true),\n            (Version::new(0, 1, 0), false),\n            (Version::new(0, 0, 9), false),\n        ] {'''
          new = '''    #[tokio::test]\n    async fn t_dist_007_newer_equal_and_older_matrix() {\n        let current = Version::parse(CURRENT_VERSION).unwrap();\n        let mut newer = current.clone();\n        newer.patch = newer.patch.checked_add(1).unwrap();\n        for (latest, expected_available) in [\n            (newer, true),\n            (current, false),\n            (Version::new(0, 0, 0), false),\n        ] {'''
          if text.count(old) != 1:
              raise SystemExit(f'update matrix anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    async fn t_dist_007_failure_matrix_preserves_successful_newer_release() {\n        let provider = Arc::new(FakeProvider::success(Version::new(0, 1, 1)));'''
          new = '''    async fn t_dist_007_failure_matrix_preserves_successful_newer_release() {\n        let mut newer = Version::parse(CURRENT_VERSION).unwrap();\n        newer.patch = newer.patch.checked_add(1).unwrap();\n        let provider = Arc::new(FakeProvider::success(newer.clone()));'''
          if text.count(old) != 1:
              raise SystemExit(f'failure matrix start anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''            assert_eq!(snapshot.latest_version, Some(Version::new(0, 1, 1)));\n            assert!(snapshot.update_available);'''
          new = '''            assert_eq!(snapshot.latest_version, Some(newer.clone()));\n            assert!(snapshot.update_available);'''
          if text.count(old) != 1:
              raise SystemExit(f'failure matrix assertion anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('src/api/tests.rs')
          text = p.read_text(encoding='utf-8')
          old = '''async fn t_dist_008_check_requires_active_header_and_maps_success_or_failure_safely() {\n    let provider = Arc::new(FixtureProvider::success(semver::Version::new(0, 1, 1)));'''
          new = '''async fn t_dist_008_check_requires_active_header_and_maps_success_or_failure_safely() {\n    let mut latest = semver::Version::parse(env!("CARGO_PKG_VERSION")).unwrap();\n    latest.patch = latest.patch.checked_add(1).unwrap();\n    let expected_latest = latest.to_string();\n    let expected_url = format!(\n        "https://github.com/Hogeexxl/MiniUsage/releases/tag/v{expected_latest}"\n    );\n    let provider = Arc::new(FixtureProvider::success(latest));'''
          if text.count(old) != 1:
              raise SystemExit(f'api check start anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    assert_eq!(body["latest_version"], "0.1.1");\n    assert_eq!(body["update_available"], true);\n    assert_eq!(\n        body["release_url"],\n        "https://github.com/Hogeexxl/MiniUsage/releases/tag/v0.1.1"\n    );'''
          new = '''    assert_eq!(body["latest_version"].as_str(), Some(expected_latest.as_str()));\n    assert_eq!(body["update_available"], true);\n    assert_eq!(body["release_url"].as_str(), Some(expected_url.as_str()));'''
          if text.count(old) != 1:
              raise SystemExit(f'api check assertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''async fn t_dist_008_open_release_requires_valid_state_and_preserves_state_on_browser_failure() {\n    let current = semver::Version::parse(env!("CARGO_PKG_VERSION")).unwrap();'''
          new = '''async fn t_dist_008_open_release_requires_valid_state_and_preserves_state_on_browser_failure() {\n    let current = semver::Version::parse(env!("CARGO_PKG_VERSION")).unwrap();\n    let mut latest = current.clone();\n    latest.patch = latest.patch.checked_add(1).unwrap();\n    let expected_url = format!(\n        "https://github.com/Hogeexxl/MiniUsage/releases/tag/v{latest}"\n    );'''
          if text.count(old) != 1:
              raise SystemExit(f'api open start anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    let provider = Arc::new(FixtureProvider::success(semver::Version::new(0, 1, 1)));'
          if text.count(old) != 2:
              raise SystemExit(f'api open provider anchor count={text.count(old)}')
          text = text.replace(old, '    let provider = Arc::new(FixtureProvider::success(latest.clone()));', 2)
          old = '''    assert_eq!(\n        browser.0.lock().unwrap().as_slice(),\n        ["https://github.com/Hogeexxl/MiniUsage/releases/tag/v0.1.1"]\n    );'''
          new = '''    assert_eq!(browser.0.lock().unwrap().as_slice(), [expected_url.as_str()]);'''
          if text.count(old) != 1:
              raise SystemExit(f'api browser url anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    assert_eq!(\n        status["release_url"],\n        "https://github.com/Hogeexxl/MiniUsage/releases/tag/v0.1.1"\n    );'''
          new = '''    assert_eq!(status["release_url"].as_str(), Some(expected_url.as_str()));'''
          if text.count(old) != 1:
              raise SystemExit(f'api status url anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify targeted update tests
        run: |
          cargo fmt --check
          cargo test --locked t_dist_007 -- --nocapture
          cargo test --locked t_dist_008 -- --nocapture
      - name: Commit clean compatibility fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-v011-update-tests.yml
          git add src/update/mod.rs src/api/tests.rs .github/workflows/fix-v011-update-tests.yml
          git commit -m "test: make update checks version-agnostic"
          git push origin HEAD:release/v0.1.1
