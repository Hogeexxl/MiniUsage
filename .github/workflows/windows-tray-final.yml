name: Windows Tray Final Gate

on:
  push:
    branches:
      - codex/windows-tray-panel
    paths:
      - src/windows_shell.rs
      - .github/workflows/windows-tray-final.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    name: Gate D - Windows GUI static CRT release
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Build embedded release binary with static CRT
        shell: pwsh
        run: |
          $previousRustflags = $env:RUSTFLAGS
          try {
            $env:RUSTFLAGS = '-C target-feature=+crt-static'
            cargo build --release --locked --features embedded-frontend
          } finally {
            if ($null -eq $previousRustflags) {
              Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
            } else {
              $env:RUSTFLAGS = $previousRustflags
            }
          }

      - name: Inspect Windows PE imports and GUI subsystem
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target/release/mini-usage.exe'
          if (-not (Test-Path $binary)) {
            throw "release binary not found: $binary"
          }
          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($null -ne $dumpbinCommand) {
            $imports = (& $dumpbinCommand.Source /DEPENDENTS $binary 2>&1 | Out-String)
            $headers = (& $dumpbinCommand.Source /HEADERS $binary 2>&1 | Out-String)
          } else {
            $llvm = Get-ChildItem -Path (rustc --print sysroot) -Filter llvm-readobj.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $llvm) {
              throw 'Neither dumpbin.exe nor llvm-readobj.exe is available for the PE dependency guard'
            }
            $inspection = (& $llvm.FullName --coff-imports --file-headers $binary 2>&1 | Out-String)
            $imports = $inspection
            $headers = $inspection
          }
          if ($imports -match '(?im)\b(?:VCRUNTIME|MSVCP)[^\s\r\n]*\.dll') {
            throw "Static CRT guard found a Visual C++ runtime dependency:`n$imports"
          }
          if ($headers -notmatch '(?im)(Windows GUI|IMAGE_SUBSYSTEM_WINDOWS_GUI|\b2\s+subsystem\s+\(Windows GUI\))') {
            throw "MiniUsage must be a GUI-subsystem executable:`n$headers"
          }
          if ($headers -notmatch '(?im)(machine\s+\(x64\)|IMAGE_FILE_MACHINE_AMD64|COFF-x86-64|\b866\b)') {
            throw "MiniUsage release binary must be an x64 PE image:`n$headers"
          }
          if ($headers -notmatch '(?im)(PE32\+|IMAGE_NT_OPTIONAL_HDR64_MAGIC|Magic:\s*0x20B\b)') {
            throw "MiniUsage release binary must use the PE32+ optional header:`n$headers"
          }
          Write-Host 'Gate D PE inspection passed.'

      - name: Upload Gate D binary
        uses: actions/upload-artifact@v4
        with:
          name: mini-usage-windows-tray-gate-d
          if-no-files-found: error
          path: target/release/mini-usage.exe

  macos-forward:
    name: Gate F - macOS forward protection
    runs-on: macos-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check macOS Rust path
        run: cargo check --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
