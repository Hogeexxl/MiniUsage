name: v0.2.2 picker final visual

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  picker-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run picker visual regression
        working-directory: frontend
        run: npx playwright test tests/browser/v022-picker-final-visual.spec.ts
