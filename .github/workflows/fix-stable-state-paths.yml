name: Fix stable state paths

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: fix stable state paths' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Make state metadata path normalization existence-independent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/codex/state_index.rs')
          text = p.read_text(encoding='utf-8')
          old = '''        paths::normalize_source_path(Path::new(value.trim()))
              .and_then(|path| path.to_str().map(ToOwned::to_owned))'''
          new = '''        // State-index paths are metadata values. Their normalized value must
              // not depend on whether the referenced file/directory exists at
              // this instant: otherwise a source disappearing can change a
              // Thread field (for example macOS /var -> /private/var after
              // canonicalization) and spuriously increment data_revision.
              paths::normalize_absolute_path(Path::new(value.trim()))
                  .and_then(|path| path.to_str().map(ToOwned::to_owned))'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'optional_path normalization: expected 1 match, got {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and focused gates
        run: |
          cargo fmt
          cargo check --locked
          cargo test --locked codex::state_index::tests
          cargo test --locked --test spec04_usage_integration
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-stable-state-paths.yml
          git add -A
          git commit -m "fix: keep state metadata paths stable when sources disappear"
          git push origin HEAD:fix/windows-fork-session-resilience
