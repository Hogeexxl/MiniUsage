name: v0.2.2 picker repair validation

on:
  push:
    branches:
      - codex/v0.2.2-optimization

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture and validate picker
        working-directory: frontend
        run: npx playwright test tests/browser/v022-picker-repair-preview.spec.ts

      - name: Commit lockfile and preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/v022-picker-repair.png
          git commit -m "test: confirm Base UI picker repair"
          git push origin HEAD:codex/v0.2.2-optimization
