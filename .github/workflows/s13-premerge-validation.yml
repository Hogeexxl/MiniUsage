name: S13 Premerge Validation

on:
  push:
    branches:
      - codex/s13-final-release-gate

permissions:
  contents: read

jobs:
  validate:
    name: Validate S13 gate wiring
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate S13 shell syntax and stable-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/s13-public-release-e2e.sh
          grep -Fq 'workflows:' .github/workflows/s13-final-validation.yml
          grep -Fq -- '- Release' .github/workflows/s13-final-validation.yml
          grep -Fq "!contains(github.event.workflow_run.head_branch, '-rc.')" .github/workflows/s13-final-validation.yml
          grep -Fq 'unset GH_TOKEN GITHUB_TOKEN' .github/scripts/s13-public-release-e2e.sh
          grep -Fq 'releases/latest' .github/scripts/s13-public-release-e2e.sh
          grep -Fq 'low_version="0.0.9"' .github/scripts/s13-public-release-e2e.sh
          grep -Fq '/api/update/check' .github/scripts/s13-public-release-e2e.sh

      - name: Build frontend required by the internal lower-version probe
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate internal lower-version build can be produced without a tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - Cargo.toml <<'PY'
          import re
          import sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          pattern = r'(?ms)(^\[package\]\s*.*?^version\s*=\s*)"[^"]+"'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '"0.0.9"', text, count=1)
          if count != 1:
              raise SystemExit('failed to rewrite package version')
          open(path, 'w', encoding='utf-8').write(updated)
          PY
          cargo build --release --features embedded-frontend
          test -x target/release/mini-usage
          file target/release/mini-usage | grep -Eq 'arm64|aarch64'
          ./target/release/mini-usage --help >/dev/null 2>&1 || true
