name: Fix README release guard

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: fix readme release guard' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Add required public release facts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '## License\n\n[MIT](LICENSE)\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one License marker, got {text.count(marker)}')
          section = '''## 平台、更新与开发\n\n- 正式发布支持：`Windows 10/11 x64` 与 `macOS Apple Silicon arm64`。\n- MiniUsage 会在后台`每 4 小时`查询一次 GitHub Releases；也可以在 Dashboard 点击`检查更新`。发现新版本时会提供`版本升级`入口。\n- 正式安装包是自包含应用；普通用户`不需要安装 Rust`，也不需要单独安装`Node.js`、`SQLite`或`Visual Studio`。\n- 只有从源码开发或执行仓库验收时才需要相应开发工具。前端测试使用 `npm run test`，Rust 全量测试使用 `cargo test --locked`。\n\n'''
          p.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY
      - name: Run public/release guards
        run: |
          cargo test --locked --test distribution_public_repo_guard
          cargo test --locked --test distribution_release_guard
          cargo test --locked --test distribution_ci_guard
      - name: Commit README and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-readme-release-guard.yml
          git add -A
          git commit -m "docs: document supported release environment"
          git push origin HEAD:fix/windows-fork-session-resilience
