name: Apply health API and UI v2

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run health ui v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Apply health patch
        run: |
          python tools/apply_health_ui.py
          python tools/fix_health_compile.py
          python tools/fix_health_tests.py
          python tools/fix_health_pre_frontend.py
          python tools/fix_health_frontend.py
      - name: Align parser-version regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/usage/normalized.rs','src/usage/processor.rs']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('assert_eq!(USAGE_PARSER_VERSION, 6);', 'assert_eq!(USAGE_PARSER_VERSION, 7);')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Format Rust
        run: cargo fmt
      - name: Backend focused gates
        run: |
          cargo check --locked
          cargo test --locked usage::aggregate::tests
          cargo test --locked api::query::tests
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Commit production changes and restore CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-health-ui-v2.yml
          rm -f tools/apply_health_ui.py tools/fix_health_compile.py tools/fix_health_tests.py tools/fix_health_pre_frontend.py tools/fix_health_frontend.py
          git add -A
          git commit -m "feat: surface Session data health in dashboard"
          git push origin HEAD:fix/windows-fork-session-resilience
