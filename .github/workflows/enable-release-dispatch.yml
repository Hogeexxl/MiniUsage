name: Enable Release workflow dispatch

on:
  push:
    branches:
      - release/enable-dispatch-v0.1.1

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: enable release workflow dispatch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/enable-dispatch-v0.1.1
          fetch-depth: 0
      - name: Add safe manual dispatch trigger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          text = p.read_text(encoding='utf-8')
          old = """on:\n  push:\n    tags:\n      - 'v*.*.*'\n"""
          new = """on:\n  push:\n    tags:\n      - 'v*.*.*'\n  workflow_dispatch:\n"""
          if text.count(old) != 1:
              raise SystemExit(f'release trigger anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit clean release workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/enable-release-dispatch.yml
          git add .github/workflows/release.yml .github/workflows/enable-release-dispatch.yml
          git commit -m "release: allow explicit tag-ref dispatch"
          git push origin HEAD:release/enable-dispatch-v0.1.1
