name: Apply resilience patch

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger resilience patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Apply guarded patch
        run: python tools/apply_resilience_patch.py
      - name: Review changes
        run: git diff --check && git status --short
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-resilience-patch.yml
          rm tools/apply_resilience_patch.py
          git add -A
          git commit -m "fix: support Windows paths and replay continuation"
          git push origin HEAD:fix/windows-fork-session-resilience
