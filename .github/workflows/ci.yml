name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-c2:
    name: Patch C2 selector
    runs-on: windows-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - name: Apply exact semantic selector fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/tests/browser/dashboard.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '  const legendButtons = modelCard.locator("button[title]");'
          new = '  const legendButtons = modelCard.getByRole("button");'
          if text.count(old) != 1:
              raise SystemExit(f"expected one old C2 selector, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit selector fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/browser/dashboard.spec.ts
          git diff --cached --check
          git commit -m "test(browser): use semantic donut legend selector"
          git push origin HEAD:agent/v0.2.0-beui-redesign
