name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Type-check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Check Rust dependencies
        run: cargo check --locked
      - name: Run all Rust tests
        run: cargo test --locked
      - name: Run Windows distribution identity/scanner evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked file_identity
          cargo test --locked scanner

  embedded:
    name: Embedded release smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build
      - name: Build embedded release binary
        run: cargo build --release --locked --features embedded-frontend
      - name: Run embedded frontend runtime smoke
        run: cargo test --locked --test distribution_runtime_integration t_dist_005_release_binary_serves_embedded_frontend_outside_repository -- --nocapture

  release-v022-bootstrap:
    name: Publish v0.2.2 and clean branches
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/v0.2.2-release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_COMMIT: 6c1190c973cebfe01fd0dd36f198e919a5bd61f7
      RELEASE_TAG: v0.2.2
    steps:
      - name: Create stable release tag
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT" --jq .sha)"
          test "$resolved" = "$TARGET_COMMIT"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
            if [[ "$existing" != "$TARGET_COMMIT" ]]; then
              echo "Existing $RELEASE_TAG points to $existing, expected $TARGET_COMMIT" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_COMMIT" >/dev/null
          fi

      - name: Dispatch canonical release workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_COMMIT\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo 'Unable to locate dispatched release workflow run' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify published stable release assets
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
          for asset in \
            "MiniUsage-v0.2.2-windows-x64-setup.exe" \
            "MiniUsage-v0.2.2-macos-arm64.dmg" \
            "SHA256SUMS.txt"; do
            jq -e --arg asset "$asset" '.assets | map(.name) | index($asset) != null' <<<"$release_json" >/dev/null
          done

      - name: Delete release work branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in "codex/v0.2.2-optimization" "ops/v0.2.2-release"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          done
