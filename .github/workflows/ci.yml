name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-gate:
    name: Browser gate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Patch browser contracts in this validation workspace
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/tests/browser/dashboard.spec.ts")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '  expect(result.statuses).toEqual([200, 200, 200, 200]);',
                  '  expect(result.statuses).toEqual([204, 200, 200, 200]);',
              ),
              (
                  '  const drawerBox = await dialog.boundingBox();\n  expect(drawerBox?.x).toBeCloseTo(0, 0);\n  expect(drawerBox?.width).toBeCloseTo(390, 0);',
                  '  await expect.poll(async () => (await dialog.boundingBox())?.x ?? Number.POSITIVE_INFINITY).toBeCloseTo(0, 0);\n  await expect.poll(async () => (await dialog.boundingBox())?.width ?? 0).toBeCloseTo(390, 0);',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact match, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Use runner Chrome for this gate
        shell: python
        run: |
          from pathlib import Path
          config = Path("frontend/playwright.config.ts")
          text = config.read_text()
          needle = '    browserName: "chromium",\n'
          if text.count(needle) != 1:
              raise SystemExit("unexpected Playwright config")
          config.write_text(text.replace(needle, needle + '    channel: "chrome",\n', 1))
      - name: Run formal browser gate
        working-directory: frontend
        run: npm run test:browser:gate
