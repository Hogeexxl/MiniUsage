name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-gate:
    name: Browser gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Use runner Chrome for this gate
        shell: python
        run: |
          from pathlib import Path
          config = Path("frontend/playwright.config.ts")
          text = config.read_text()
          needle = '    browserName: "chromium",\n'
          if text.count(needle) != 1:
              raise SystemExit("unexpected Playwright config")
          config.write_text(text.replace(needle, needle + '    channel: "chrome",\n', 1))
      - name: Run formal browser gate
        working-directory: frontend
        run: npm run test:browser:gate
