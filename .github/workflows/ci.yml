name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Type-check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Check Rust dependencies
        run: cargo check --locked
      - name: Run all Rust tests
        run: cargo test --locked
      - name: Run Windows distribution identity/scanner evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked file_identity
          cargo test --locked scanner

  embedded:
    name: Embedded release smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            architecture: AMD64
          - name: macOS arm64
            os: macos-latest
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected an x64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build
      - name: Build embedded release binary
        run: cargo build --release --locked --features embedded-frontend
      - name: Run embedded frontend runtime smoke
        run: cargo test --locked --test distribution_runtime_integration t_dist_005_release_binary_serves_embedded_frontend_outside_repository -- --nocapture

  v020-contract-patch:
    name: v0.2.0 contract patch
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/v0.2.0-beui-redesign'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.2.0-beui-redesign
          fetch-depth: 0
      - name: Apply exact approved contract changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, got {count}: {old[:80]!r}")
              p.write_text(s.replace(old, new))

          a = "src/usage/aggregate.rs"
          replace(a,"    pub session_count: i64,\n    pub health: SessionHealthSummary,\n","    pub session_count: i64,\n    pub cost_incomplete_session_count: i64,\n    pub health: SessionHealthSummary,\n")
          replace(a,"    pub combined_total_tokens: Option<i64>,\n    pub cache_hit_rate: Option<f64>,\n","    pub combined_total_tokens: Option<i64>,\n    pub combined_estimated_cost_nanos_usd: Option<i64>,\n    pub cache_hit_rate: Option<f64>,\n")
          replace(a,"    CombinedTotalTokens,\n    CacheHitRate,\n","    CombinedTotalTokens,\n    CombinedEstimatedCost,\n    CacheHitRate,\n")
          replace(a,"            combined_total_tokens: Some(self.inclusive_usage.total_tokens),\n            cache_hit_rate: self.inclusive_usage.cache_hit_rate,\n","            combined_total_tokens: Some(self.inclusive_usage.total_tokens),\n            combined_estimated_cost_nanos_usd: self.inclusive_usage.estimated_cost_nanos_usd,\n            cache_hit_rate: self.inclusive_usage.cache_hit_rate,\n")
          replace(a,"        Ok(UsageSummary {\n            totals,\n            session_count,\n            health: SessionHealthSummary {\n","        Ok(UsageSummary {\n            totals,\n            session_count,\n            cost_incomplete_session_count: incomplete_sessions,\n            health: SessionHealthSummary {\n")
          replace(a,"            combined_total_tokens: None,\n            cache_hit_rate: None,\n","            combined_total_tokens: None,\n            combined_estimated_cost_nanos_usd: None,\n            cache_hit_rate: None,\n")
          replace(a,"        SessionSortField::CombinedTotalTokens => {\n            number(left.combined_total_tokens, right.combined_total_tokens)\n        }\n        SessionSortField::CacheHitRate => ratio(left.cache_hit_rate, right.cache_hit_rate),\n","        SessionSortField::CombinedTotalTokens => {\n            number(left.combined_total_tokens, right.combined_total_tokens)\n        }\n        SessionSortField::CombinedEstimatedCost => number(\n            left.combined_estimated_cost_nanos_usd,\n            right.combined_estimated_cost_nanos_usd,\n        ),\n        SessionSortField::CacheHitRate => ratio(left.cache_hit_rate, right.cache_hit_rate),\n")
          replace(a,"    let compare_number = |left: i64, right: i64| match order {\n        SessionSortOrder::Asc => left.cmp(&right),\n        SessionSortOrder::Desc => right.cmp(&left),\n    };\n    let compare_ratio = |left: Option<f64>, right: Option<f64>| match (left, right) {\n","    let compare_number = |left: i64, right: i64| match order {\n        SessionSortOrder::Asc => left.cmp(&right),\n        SessionSortOrder::Desc => right.cmp(&left),\n    };\n    let compare_optional_number = |left: Option<i64>, right: Option<i64>| match (left, right) {\n        (None, None) => Ordering::Equal,\n        (None, Some(_)) => Ordering::Greater,\n        (Some(_), None) => Ordering::Less,\n        (Some(left), Some(right)) => match order {\n            SessionSortOrder::Asc => left.cmp(&right),\n            SessionSortOrder::Desc => right.cmp(&left),\n        },\n    };\n    let compare_ratio = |left: Option<f64>, right: Option<f64>| match (left, right) {\n")
          replace(a,"        SessionSortField::CombinedTotalTokens => compare_number(\n            left.inclusive_usage.total_tokens,\n            right.inclusive_usage.total_tokens,\n        ),\n        SessionSortField::CacheHitRate => compare_ratio(\n","        SessionSortField::CombinedTotalTokens => compare_number(\n            left.inclusive_usage.total_tokens,\n            right.inclusive_usage.total_tokens,\n        ),\n        SessionSortField::CombinedEstimatedCost => compare_optional_number(\n            left.inclusive_usage.estimated_cost_nanos_usd,\n            right.inclusive_usage.estimated_cost_nanos_usd,\n        ),\n        SessionSortField::CacheHitRate => compare_ratio(\n")
          p = Path(a)
          s = p.read_text()
          marker = "        transaction.commit().unwrap();\n    }\n}\n"
          if s.count(marker) != 1:
              raise SystemExit("aggregate test marker mismatch")
          tests = '''        transaction.commit().unwrap();
    }

    #[test]
    fn v020_summary_reports_cost_incomplete_root_count() {
        let connection = cost_fixture();
        let reader = AggregateReader::new(&connection);
        let partial = reader.summary(SummaryQuery::new(TimeRange::new(0, 9).unwrap(), UsageFilter::default())).unwrap();
        assert_eq!(partial.session_count, 1);
        assert_eq!(partial.cost_incomplete_session_count, 1);
        let complete = reader.summary(SummaryQuery::new(TimeRange::new(0, 4).unwrap(), UsageFilter::default())).unwrap();
        assert_eq!(complete.cost_incomplete_session_count, 0);
    }

    #[test]
    fn v020_combined_estimated_cost_sort_is_null_last_for_both_orders() {
        fn item(id: &str, cost: Option<i64>) -> SessionSortIndexItem {
            SessionSortIndexItem { root_session_id:id.to_owned(), last_activity_at_ms:1, project_sort_key:None, model_sort_key:None, total_tokens:Some(1), combined_total_tokens:Some(1), combined_estimated_cost_nanos_usd:cost, cache_hit_rate:None, data_status:SessionDataStatus::Complete, error_code:None }
        }
        let mut rows = vec![item("unknown",None), item("low",Some(100)), item("high",Some(300))];
        rows.sort_by(|l,r| compare_sort_index_items(l,r,SessionSortField::CombinedEstimatedCost,SessionSortOrder::Desc));
        assert_eq!(rows.iter().map(|r|r.root_session_id.as_str()).collect::<Vec<_>>(), vec!["high","low","unknown"]);
        rows.sort_by(|l,r| compare_sort_index_items(l,r,SessionSortField::CombinedEstimatedCost,SessionSortOrder::Asc));
        assert_eq!(rows.iter().map(|r|r.root_session_id.as_str()).collect::<Vec<_>>(), vec!["low","high","unknown"]);
    }
}
'''
          p.write_text(s.replace(marker, tests))

          q = "src/api/query.rs"
          replace(q,"    pub session_count: i64,\n    pub session_health: SessionHealthDto,\n","    pub session_count: i64,\n    pub cost_incomplete_session_count: i64,\n    pub session_health: SessionHealthDto,\n")
          replace(q,"    pub combined_total_tokens: Option<i64>,\n    pub cache_hit_rate: Option<f64>,\n","    pub combined_total_tokens: Option<i64>,\n    pub combined_estimated_cost: Option<f64>,\n    pub cache_hit_rate: Option<f64>,\n")
          replace(q,'        "combined_total_tokens" => Ok(SessionSortField::CombinedTotalTokens),\n        "cache_hit_rate" => Ok(SessionSortField::CacheHitRate),\n','        "combined_total_tokens" => Ok(SessionSortField::CombinedTotalTokens),\n        "combined_estimated_cost" => Ok(SessionSortField::CombinedEstimatedCost),\n        "cache_hit_rate" => Ok(SessionSortField::CacheHitRate),\n')
          replace(q,"    ensure_safe(snapshot.value.session_count)?;\n    for value in [\n","    ensure_safe(snapshot.value.session_count)?;\n    ensure_safe(snapshot.value.cost_incomplete_session_count)?;\n    for value in [\n")
          replace(q,"            session_count: snapshot.value.session_count,\n            session_health: SessionHealthDto {\n","            session_count: snapshot.value.session_count,\n            cost_incomplete_session_count: snapshot.value.cost_incomplete_session_count,\n            session_health: SessionHealthDto {\n")
          replace(q,"    if let Some(value) = row.combined_total_tokens {\n        ensure_safe(value)?;\n    }\n    if row\n","    if let Some(value) = row.combined_total_tokens {\n        ensure_safe(value)?;\n    }\n    let combined_estimated_cost = match row.combined_estimated_cost_nanos_usd {\n        Some(value) if value >= 0 => Some(value as f64 / 1_000_000_000.0),\n        Some(_) => return Err(ApiError::QueryFailed),\n        None => None,\n    };\n    if row\n")
          replace(q,"        total_tokens: row.total_tokens,\n        combined_total_tokens: row.combined_total_tokens,\n        cache_hit_rate: row.cache_hit_rate,\n","        total_tokens: row.total_tokens,\n        combined_total_tokens: row.combined_total_tokens,\n        combined_estimated_cost,\n        cache_hit_rate: row.cache_hit_rate,\n")
          p = Path(q)
          s = p.read_text()
          s = re.sub(r'(UsageSummary \{(?:(?!UsageSummary \{).)*?\n\s*session_count: [^,]+,\n)(\s*health:)', r'\1            cost_incomplete_session_count: 0,\n\2', s, flags=re.S)
          s = re.sub(r'(SessionSortIndexItem \{(?:(?!SessionSortIndexItem \{).)*?\n\s*combined_total_tokens: [^,]+,\n)(\s*cache_hit_rate:)', r'\1            combined_estimated_cost_nanos_usd: None,\n\2', s, flags=re.S)
          p.write_text(s)

          t = "frontend/src/data/types.ts"
          replace(t,"  session_count: number;\n  session_health: SessionHealthDto;\n","  session_count: number;\n  cost_incomplete_session_count: number;\n  session_health: SessionHealthDto;\n")
          replace(t,'  | "combined_total_tokens"\n  | "cache_hit_rate";\n','  | "combined_total_tokens"\n  | "combined_estimated_cost"\n  | "cache_hit_rate";\n')
          replace(t,"  combined_total_tokens: number | null;\n  cache_hit_rate: number | null;\n","  combined_total_tokens: number | null;\n  combined_estimated_cost: number | null;\n  cache_hit_rate: number | null;\n")
          PY
      - name: Format and validate contracts
        run: |
          cargo fmt
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cd frontend
          npm ci
          npm test
          npm run check
      - name: Commit approved contract changes and remove temporary scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/v020-phase-a-patch.yml docs/.v020-pr-placeholder docs/.v020-pr-placeholder-2
          git add .github/workflows/ci.yml src/usage/aggregate.rs src/api/query.rs frontend/src/data/types.ts
          git commit -m "feat: add v0.2.0 dashboard data contracts"
          git push origin HEAD:feat/v0.2.0-beui-redesign
