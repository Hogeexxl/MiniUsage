name: Agent v0.2 browser gate

on:
  push:
    branches:
      - agent/v0.2.0-beui-redesign

permissions:
  contents: write

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run formal browser gate
        id: gate
        continue-on-error: true
        working-directory: frontend
        run: npm run test:browser:gate
      - name: Remove temporary gate files
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/agent-browser-gate.yml frontend/tests/browser/.agent-browser-gate-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/agent-browser-gate.yml frontend/tests/browser/.agent-browser-gate-trigger
          git diff --cached --check
          git commit -m "chore: remove temporary browser gate runner"
          git push origin HEAD:agent/v0.2.0-beui-redesign
      - name: Require browser gate success
        if: always()
        shell: bash
        run: test '${{ steps.gate.outcome }}' = success
