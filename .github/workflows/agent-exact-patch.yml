name: Agent exact patch

on:
  push:
    branches:
      - agent/v0.2.0-beui-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - name: Apply exact replacements and self-delete
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/usage/processor.rs",
              "assert_eq!(crate::usage::USAGE_PARSER_VERSION, 8);",
              "assert_eq!(crate::usage::USAGE_PARSER_VERSION, 9);",
          )
          replace_once(
              "frontend/src/dashboard/useDashboardController.test.tsx",
              "    session_count: 1,\n    session_health: {",
              "    session_count: 1,\n    cost_incomplete_session_count: 1,\n    session_health: {",
          )
          Path(".github/workflows/agent-exact-patch.yml").unlink()
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/usage/processor.rs frontend/src/dashboard/useDashboardController.test.tsx .github/workflows/agent-exact-patch.yml
          git diff --cached --check
          git commit -m "test: align parser v9 and summary fixture"
          git push origin HEAD:agent/v0.2.0-beui-redesign
