name: v0.2.2 picker preview

on:
  push:
    branches:
      - codex/v0.2.2-optimization

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run picker preview test
        working-directory: frontend
        run: npx playwright test tests/browser/v022-picker-preview.spec.ts

      - name: Commit preview screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/v022-base-ui-range-picker.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/v022-base-ui-range-picker.png
          git commit -m "test: capture Base UI range picker preview"
          git push origin HEAD:codex/v0.2.2-optimization
