name: Sync v0.2.3 Lockfiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lockfiles:
    if: github.head_ref == 'fix/v0.2.3-calendar-range'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.2.3-calendar-range

      - name: Update lockfile package versions only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.lock')
          text = cargo.read_text()
          old = 'name = "mini-usage"\nversion = "0.2.2"'
          new = 'name = "mini-usage"\nversion = "0.2.3"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one MiniUsage 0.2.2 lock entry, found {text.count(old)}')
          cargo.write_text(text.replace(old, new, 1))

          package_lock = Path('frontend/package-lock.json')
          text = package_lock.read_text()
          needle = '"version": "0.2.2"'
          if text.count(needle) < 2:
              raise SystemExit('expected at least two package-lock 0.2.2 version entries')
          package_lock.write_text(text.replace(needle, '"version": "0.2.3"', 2))
          PY

      - name: Verify lockfiles and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- Cargo.lock frontend/package-lock.json
          grep -A2 '^name = "mini-usage"$' Cargo.lock | grep 'version = "0.2.3"'
          test "$(grep -c '"version": "0.2.3"' frontend/package-lock.json)" -ge 2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock frontend/package-lock.json
          git commit -m 'chore: refresh v0.2.3 lockfiles'
          git push origin HEAD:fix/v0.2.3-calendar-range
