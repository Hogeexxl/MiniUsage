name: Apply health API and UI

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run health ui patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Apply guarded patch
        run: python tools/apply_health_ui.py
      - name: Format Rust
        run: cargo fmt
      - name: Backend compile and focused tests
        run: |
          cargo check --locked
          cargo test --locked usage::aggregate::tests
          cargo test --locked api::query::tests
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-health-ui.yml
          rm -f tools/apply_health_ui.py
          git add -A
          git commit -m "feat: surface Session data health in dashboard"
          git push origin HEAD:fix/windows-fork-session-resilience
