name: Agent client contract patch

on:
  push:
    branches:
      - agent/v0.2.0-beui-redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - name: Patch DTO parser and fixtures exactly
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "frontend/src/data/miniUsageClient.ts",
              '  const sessionCount = requiredSafeInteger(record, "session_count");\n  const healthRecord = requiredRecord(record.session_health);',
              '  const sessionCount = requiredSafeInteger(record, "session_count");\n  const costIncompleteSessionCount = requiredSafeInteger(record, "cost_incomplete_session_count");\n  if (costIncompleteSessionCount > sessionCount) {\n    throw new MiniUsageClientError("HTTP_ERROR", 200);\n  }\n  const healthRecord = requiredRecord(record.session_health);',
          )
          replace_once(
              "frontend/src/data/miniUsageClient.ts",
              '    session_count: sessionCount,\n    session_health: sessionHealth,',
              '    session_count: sessionCount,\n    cost_incomplete_session_count: costIncompleteSessionCount,\n    session_health: sessionHealth,',
          )
          replace_once(
              "frontend/src/data/miniUsageClient.ts",
              '  const combinedTotalTokens = nullableSafeInteger(record, "combined_total_tokens");\n  if (dataStatus === "error") {\n    if (totalTokens !== null || combinedTotalTokens !== null || !errorCode) {',
              '  const combinedTotalTokens = nullableSafeInteger(record, "combined_total_tokens");\n  const combinedEstimatedCost = nullableCost(record, "combined_estimated_cost");\n  if (dataStatus === "error") {\n    if (totalTokens !== null || combinedTotalTokens !== null || combinedEstimatedCost !== null || !errorCode) {',
          )
          replace_once(
              "frontend/src/data/miniUsageClient.ts",
              '    combined_total_tokens: combinedTotalTokens,\n    cache_hit_rate: nullableRatio(record, "cache_hit_rate"),',
              '    combined_total_tokens: combinedTotalTokens,\n    combined_estimated_cost: combinedEstimatedCost,\n    cache_hit_rate: nullableRatio(record, "cache_hit_rate"),',
          )
          replace_once(
              "frontend/src/data/miniUsageClient.test.ts",
              '  session_count: 1,\n  session_health: {',
              '  session_count: 1,\n  cost_incomplete_session_count: 1,\n  session_health: {',
          )
          replace_once(
              "frontend/src/data/miniUsageClient.test.ts",
              '      combined_total_tokens: 30,\n      cache_hit_rate: 0.4,',
              '      combined_total_tokens: 30,\n      combined_estimated_cost: null,\n      cache_hit_rate: 0.4,',
          )
          Path(".github/workflows/agent-client-contract-patch.yml").unlink()
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/miniUsageClient.ts frontend/src/data/miniUsageClient.test.ts .github/workflows/agent-client-contract-patch.yml
          git diff --cached --check
          git commit -m "fix(frontend): parse new summary and session cost fields"
          git push origin HEAD:agent/v0.2.0-beui-redesign
