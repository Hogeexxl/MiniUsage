name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Verify tag matches Cargo package version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages) | Where-Object { $_.name -eq 'mini-usage' } | Select-Object -First 1
          if ($null -eq $package) {
            throw 'Cargo package mini-usage was not found'
          }
          $tag = [string]$env:GITHUB_REF_NAME
          $tagMatch = [regex]::Match($tag, '^v(?<base>\d+\.\d+\.\d+)(?<suffix>-rc\.\d+)?$')
          if (-not $tagMatch.Success) {
            throw "Release tag must match vX.Y.Z or vX.Y.Z-rc.N, got $tag"
          }
          $cargoVersion = [string]$package.version
          $tagBase = $tagMatch.Groups['base'].Value
          if ($tagBase -ne $cargoVersion) {
            throw "Release tag base $tagBase does not match Cargo package version $cargoVersion"
          }
          $tagVersion = $tag.Substring(1)
          $isCandidate = $tagMatch.Groups['suffix'].Success
          if (-not $isCandidate -and $tagVersion -ne $cargoVersion) {
            throw "Stable release tag $tag must exactly match v$cargoVersion"
          }
          $candidateValue = if ($isCandidate) { 'true' } else { 'false' }
          "version=$tagVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cargo_version=$cargoVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_candidate=$candidateValue" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_VERSION=$cargoVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_CANDIDATE=$candidateValue" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run locked Rust tests
        run: cargo test --locked

      - name: Build embedded release binary with static CRT
        shell: pwsh
        run: |
          $previousRustflags = $env:RUSTFLAGS
          try {
            $env:RUSTFLAGS = '-C target-feature=+crt-static'
            cargo build --release --locked --features embedded-frontend
          } finally {
            if ($null -eq $previousRustflags) {
              Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
            } else {
              $env:RUSTFLAGS = $previousRustflags
            }
          }

      - name: Inspect Windows PE imports and console subsystem
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target/release/mini-usage.exe'
          if (-not (Test-Path $binary)) {
            throw "release binary not found: $binary"
          }
          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($null -ne $dumpbinCommand) {
            $imports = (& $dumpbinCommand.Source /DEPENDENTS $binary 2>&1 | Out-String)
            $headers = (& $dumpbinCommand.Source /HEADERS $binary 2>&1 | Out-String)
          } else {
            $llvm = Get-ChildItem -Path (rustc --print sysroot) -Filter llvm-readobj.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $llvm) {
              throw 'Neither dumpbin.exe nor llvm-readobj.exe is available for the PE dependency guard'
            }
            $inspection = (& $llvm.FullName --coff-imports --file-headers $binary 2>&1 | Out-String)
            $imports = $inspection
            $headers = $inspection
          }
          if ($imports -match '(?im)\b(?:VCRUNTIME|MSVCP)[^\s\r\n]*\.dll') {
            throw "Static CRT guard found a Visual C++ runtime dependency:`n$imports"
          }
          if ($headers -notmatch '(?im)(Windows CUI|IMAGE_SUBSYSTEM_WINDOWS_CUI|\b3\s+subsystem\s+\(Windows CUI\))') {
            throw "MiniUsage must remain a console-subsystem executable:`n$headers"
          }
          if ($headers -notmatch '(?im)(machine\s+\(x64\)|IMAGE_FILE_MACHINE_AMD64|COFF-x86-64|\b866\b)') {
            throw "MiniUsage release binary must be an x64 PE image:`n$headers"
          }
          if ($headers -notmatch '(?im)(PE32\+|IMAGE_NT_OPTIONAL_HDR64_MAGIC|\b20B\b)') {
            throw "MiniUsage release binary must use the PE32+ optional header:`n$headers"
          }

      - name: Install pinned cargo-packager
        shell: pwsh
        run: cargo install cargo-packager --locked --version $env:CARGO_PACKAGER_VERSION

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cargo packager --release --formats nsis
          $generated = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'target/release') -Filter '*-setup.exe' -File)
          if ($generated.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($generated.Count)"
          }
          $expectedPackagerName = "mini-usage_$($env:CARGO_VERSION)_x64-setup.exe"
          if ($generated[0].Name -cne $expectedPackagerName) {
            throw "Expected cargo-packager NSIS basename $expectedPackagerName (Cargo base $env:CARGO_VERSION; final tag $env:TAG_VERSION), got $($generated[0].Name)"
          }
          $asset = Join-Path $env:GITHUB_WORKSPACE "target/release/MiniUsage-v$env:TAG_VERSION-windows-x64-setup.exe"
          Move-Item -LiteralPath $generated[0].FullName -Destination $asset -Force
          if (-not (Test-Path $asset)) {
            throw "Expected Windows asset was not created: $asset"
          }

      - name: T-DIST-013 clean-runtime installer smoke
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "target/release/MiniUsage-v$env:TAG_VERSION-windows-x64-setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP 'miniusage-installed'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'miniusage-runtime'
          $home = Join-Path $runtimeRoot 'home'
          $codexHome = Join-Path $home '.codex'
          $localAppData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if ([string]::IsNullOrWhiteSpace($localAppData)) {
            throw 'Windows LocalApplicationData known folder could not be resolved'
          }
          $appData = Join-Path $home 'AppData/Roaming'
          $temp = Join-Path $runtimeRoot 'temp'
          $codexSessions = Join-Path $codexHome 'sessions'
          $codexArchived = Join-Path $codexHome 'archived_sessions'
          $appDataRoot = Join-Path $localAppData 'MiniUsage'
          $databasePath = Join-Path $appDataRoot 'mu.sqlite3'
          $sentinelPath = Join-Path $appDataRoot 'acceptance-user-data.txt'
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          if (Test-Path -LiteralPath $appDataRoot) {
            Remove-Item -LiteralPath $appDataRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $installRoot, $runtimeRoot, $home, $temp, $appData, $codexSessions, $codexArchived | Out-Null

          try {
          function Invoke-InstalledRuntimeSmoke {
            param(
              [Parameter(Mandatory = $true)][string]$BinaryPath,
              [Parameter(Mandatory = $true)][string]$RuntimeRoot,
              [Parameter(Mandatory = $true)][string]$Home,
              [Parameter(Mandatory = $true)][string]$LocalAppData,
              [Parameter(Mandatory = $true)][string]$AppData,
              [Parameter(Mandatory = $true)][string]$CodexHome,
              [Parameter(Mandatory = $true)][string]$Temp
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $BinaryPath
            $startInfo.WorkingDirectory = $RuntimeRoot
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.Environment.Clear()
            $startInfo.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
            $startInfo.Environment['SystemRoot'] = $env:SystemRoot
            $startInfo.Environment['WINDIR'] = $env:SystemRoot
            $startInfo.Environment['HOME'] = $Home
            $startInfo.Environment['USERPROFILE'] = $Home
            $startInfo.Environment['LOCALAPPDATA'] = $LocalAppData
            $startInfo.Environment['APPDATA'] = $AppData
            $startInfo.Environment['TEMP'] = $Temp
            $startInfo.Environment['TMP'] = $Temp
            $startInfo.Environment['CODEX_HOME'] = $CodexHome
            $startInfo.Environment['MINIUSAGE_DISABLE_BROWSER'] = '1'
            $process = $null
            try {
              $process = [System.Diagnostics.Process]::Start($startInfo)
              $healthy = $false
              $deadline = (Get-Date).AddSeconds(30)
              while ((Get-Date) -lt $deadline) {
                try {
                  $response = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri 'http://127.0.0.1:3210/api/health' -TimeoutSec 2
                  $expectedBinaryVersion = $env:CARGO_VERSION
                  if ($response.StatusCode -eq 204 -and
                      [string]$response.Headers['X-MiniUsage-App'] -eq 'MiniUsage' -and
                      [string]$response.Headers['X-MiniUsage-Version'] -eq $expectedBinaryVersion) {
                    $healthy = $true
                    break
                  }
                } catch {
                  # The listener may not be ready yet.
                }
                Start-Sleep -Milliseconds 250
              }
              if (-not $healthy) {
                throw 'Installed Windows runtime did not pass the health marker/version smoke'
              }

              $root = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri 'http://127.0.0.1:3210/' -TimeoutSec 5
              if ($root.StatusCode -ne 200 -or [string]$root.Headers['Content-Type'] -notmatch '(?i)^text/html(?:;|$)' -or [string]::IsNullOrWhiteSpace([string]$root.Content)) {
                throw 'Installed Windows runtime root did not return a non-empty HTML document'
              }
              $references = [regex]::Matches([string]$root.Content, '(?:src|href)="([^"]+)"') |
                ForEach-Object { $_.Groups[1].Value } |
                Where-Object { $_ -match '^/' }
              $javascriptReference = $references | Where-Object { $_ -match '(?i)\.js(?:\?|$)' } | Select-Object -First 1
              $stylesheetReference = $references | Where-Object { $_ -match '(?i)\.css(?:\?|$)' } | Select-Object -First 1
              if ($null -eq $javascriptReference -or $null -eq $stylesheetReference) {
                throw 'Installed Windows runtime index did not reference both JavaScript and CSS assets'
              }
              foreach ($assetReference in @($javascriptReference, $stylesheetReference)) {
                $assetResponse = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri ("http://127.0.0.1:3210" + $assetReference) -TimeoutSec 5
                if ($assetResponse.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace([string]$assetResponse.Content)) {
                  throw "Installed Windows runtime asset failed: $assetReference"
                }
                $assetType = [string]$assetResponse.Headers['Content-Type']
                if ($assetReference -match '(?i)\.js(?:\?|$)' -and $assetType -notmatch '(?i)(?:application|text)/javascript') {
                  throw "JavaScript asset has unexpected MIME type $assetType"
                }
                if ($assetReference -match '(?i)\.css(?:\?|$)' -and $assetType -notmatch '(?i)text/css') {
                  throw "CSS asset has unexpected MIME type $assetType"
                }
              }

              $spa = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri 'http://127.0.0.1:3210/acceptance/spa-route' -TimeoutSec 5
              if ($spa.StatusCode -ne 200 -or [string]$spa.Headers['Content-Type'] -notmatch '(?i)^text/html(?:;|$)' -or [string]$spa.Content -notmatch '(?i)<html') {
                throw 'Installed Windows runtime did not serve the SPA fallback document'
              }
              $unknownApi = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Uri 'http://127.0.0.1:3210/api/acceptance-not-found' -TimeoutSec 5
              if ($unknownApi.StatusCode -ne 404 -or [string]$unknownApi.Headers['Content-Type'] -notmatch '(?i)application/json') {
                throw 'Installed Windows runtime unknown API did not return JSON 404'
              }
              $unknownApiBody = [string]$unknownApi.Content | ConvertFrom-Json
              if ($unknownApiBody.error.code -ne 'NOT_FOUND') {
                throw 'Installed Windows runtime unknown API returned the wrong error code'
              }
            } finally {
              if ($null -ne $process) {
                if (-not $process.HasExited) {
                  try {
                    $process.Kill()
                  } catch {
                    # The process can exit between HasExited and Kill.
                  }
                  try {
                    $process.WaitForExit()
                  } catch {
                    # Preserve the smoke failure while still attempting cleanup.
                  }
                }
                $process.Dispose()
              }
            }
          }

          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with $($install.ExitCode)"
          }
          $installedBinary = Get-ChildItem -Path $installRoot -Recurse -Filter 'mini-usage.exe' -File | Select-Object -First 1
          if ($null -eq $installedBinary) {
            throw 'Installed mini-usage.exe was not found'
          }
          if ($installedBinary.FullName.StartsWith($env:GITHUB_WORKSPACE, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Installed binary unexpectedly resolves inside the repository'
          }
          if (Get-ChildItem -Path $installRoot -Recurse -Directory | Where-Object { $_.Name -eq 'frontend' }) {
            throw 'Installed runtime unexpectedly contains a frontend directory'
          }
          $uninstallers = @(Get-ChildItem -Path $installRoot -Recurse -Filter 'uninstall*.exe' -File)
          if ($uninstallers.Count -ne 1) {
            throw "Expected exactly one NSIS uninstaller (uninstall*.exe, including packager uninstall.exe), found $($uninstallers.Count)"
          }
          $uninstallerPath = $uninstallers[0].FullName
          Invoke-InstalledRuntimeSmoke -BinaryPath $installedBinary.FullName -RuntimeRoot $runtimeRoot -Home $home -LocalAppData $localAppData -AppData $appData -CodexHome $codexHome -Temp $temp

          if (-not (Test-Path -LiteralPath $appDataRoot -PathType Container) -or -not (Test-Path -LiteralPath $databasePath -PathType Leaf)) {
            throw "Installed runtime did not create its user database: $databasePath"
          }
          Set-Content -LiteralPath $sentinelPath -Value 'preserve across reinstall' -NoNewline
          $databaseHashBeforeReinstall = (Get-FileHash -LiteralPath $databasePath -Algorithm SHA256).Hash

          $reinstall = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -NoNewWindow
          if ($reinstall.ExitCode -ne 0) {
            throw "NSIS reinstall exited with $($reinstall.ExitCode)"
          }
          if ((Get-Content -LiteralPath $sentinelPath -Raw) -ne 'preserve across reinstall' -or -not (Test-Path $databasePath)) {
            throw 'NSIS reinstall did not preserve isolated MiniUsage user data'
          }
          if ((Get-FileHash -LiteralPath $databasePath -Algorithm SHA256).Hash -ne $databaseHashBeforeReinstall) {
            throw 'NSIS reinstall changed the isolated MiniUsage database'
          }
          $installedBinary = Get-ChildItem -Path $installRoot -Recurse -Filter 'mini-usage.exe' -File | Select-Object -First 1
          Invoke-InstalledRuntimeSmoke -BinaryPath $installedBinary.FullName -RuntimeRoot $runtimeRoot -Home $home -LocalAppData $localAppData -AppData $appData -CodexHome $codexHome -Temp $temp
          if ((Get-Content -LiteralPath $sentinelPath -Raw) -ne 'preserve across reinstall') {
            throw 'Installed runtime relaunch did not preserve isolated MiniUsage user data'
          }

          $databaseHashBeforeUninstall = (Get-FileHash -LiteralPath $databasePath -Algorithm SHA256).Hash
          $sentinelHashBeforeUninstall = (Get-FileHash -LiteralPath $sentinelPath -Algorithm SHA256).Hash
          if (-not (Test-Path -LiteralPath $uninstallerPath -PathType Leaf)) {
            throw "NSIS uninstaller disappeared before uninstall: $uninstallerPath"
          }
          $uninstall = Start-Process -FilePath $uninstallerPath -ArgumentList @('/S') -Wait -PassThru -NoNewWindow
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          $uninstallDeadline = (Get-Date).AddSeconds(30)
          while ((Test-Path -LiteralPath $installRoot) -and ((Get-Date) -lt $uninstallDeadline)) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $installedBinary.FullName) {
            throw 'NSIS uninstall left mini-usage.exe in the install directory'
          }
          if (Test-Path -LiteralPath $installRoot) {
            $remainingInstalledExecutables = @(Get-ChildItem -Path $installRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)^mini-usage(?:\.exe)?$' })
            if ($remainingInstalledExecutables.Count -ne 0) {
              throw 'NSIS uninstall left an installed MiniUsage executable in the install directory'
            }
            throw "NSIS uninstall left the install directory in place: $installRoot"
          }
          if (-not (Test-Path -LiteralPath $sentinelPath -PathType Leaf) -or -not (Test-Path -LiteralPath $databasePath -PathType Leaf)) {
            throw 'NSIS uninstall removed isolated MiniUsage user data'
          }
          if ((Get-FileHash -LiteralPath $databasePath -Algorithm SHA256).Hash -ne $databaseHashBeforeUninstall) {
            throw 'NSIS uninstall changed the isolated MiniUsage database'
          }
          if ((Get-FileHash -LiteralPath $sentinelPath -Algorithm SHA256).Hash -ne $sentinelHashBeforeUninstall) {
            throw 'NSIS uninstall changed isolated MiniUsage user data'
          }
          } finally {
            if (Test-Path -LiteralPath $appDataRoot) {
              Remove-Item -LiteralPath $appDataRoot -Recurse -Force
            }
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force
            }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: target/release/MiniUsage-v${{ steps.version.outputs.version }}-windows-x64-setup.exe

  macos:
    name: macOS arm64 release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Verify tag matches Cargo package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          cargo_version="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mini-usage"))')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-rc.N, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_base="${BASH_REMATCH[1]}"
          tag_suffix="${BASH_REMATCH[2]-}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_base" != "$cargo_version" ]]; then
            echo "Release tag base $tag_base does not match Cargo package version $cargo_version" >&2
            exit 1
          fi
          is_candidate=false
          if [[ -n "$tag_suffix" ]]; then
            is_candidate=true
          fi
          if [[ "$is_candidate" == false && "$tag_version" != "$cargo_version" ]]; then
            echo "Stable release tag $GITHUB_REF_NAME must exactly match v$cargo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"
          printf 'cargo_version=%s\n' "$cargo_version" >> "$GITHUB_OUTPUT"
          printf 'is_candidate=%s\n' "$is_candidate" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$tag_version" >> "$GITHUB_ENV"
          printf 'TAG_VERSION=%s\n' "$tag_version" >> "$GITHUB_ENV"
          printf 'CARGO_VERSION=%s\n' "$cargo_version" >> "$GITHUB_ENV"
          printf 'IS_CANDIDATE=%s\n' "$is_candidate" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run locked Rust tests
        run: cargo test --locked

      - name: Build arm64 embedded release binary
        run: cargo build --release --locked --features embedded-frontend

      - name: Inspect arm64 release binary
        run: |
          file target/release/mini-usage
          file target/release/mini-usage | grep -Eq 'arm64|aarch64'

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Build unsigned DMG
        run: |
          cargo packager --release --formats dmg
          generated=()
          while IFS= read -r generated_path; do
            generated+=("$generated_path")
          done < <(find target/release -maxdepth 1 -type f -name '*.dmg' -print)
          if [[ "${#generated[@]}" -ne 1 ]]; then
            echo "Expected exactly one cargo-packager DMG, found ${#generated[@]}" >&2
            exit 1
          fi
          generated_name="$(basename "${generated[0]}")"
          if [[ "$generated_name" != "MiniUsage_${CARGO_VERSION}_aarch64.dmg" && "$generated_name" != "MiniUsage_${CARGO_VERSION}_arm64.dmg" ]]; then
            echo "Expected cargo-packager DMG basename MiniUsage_${CARGO_VERSION}_{aarch64|arm64}.dmg (final tag ${TAG_VERSION}), got $generated_name" >&2
            exit 1
          fi
          asset="target/release/MiniUsage-v${TAG_VERSION}-macos-arm64.dmg"
          mv "${generated[0]}" "$asset"
          test -f "$asset"

      - name: T-DIST-014 clean-runtime arm64 DMG smoke
        shell: bash
        run: |
          set -euo pipefail
          asset="target/release/MiniUsage-v${TAG_VERSION}-macos-arm64.dmg"
          runtime_root="$RUNNER_TEMP/miniusage-runtime"
          home="$runtime_root/home"
          codex_home="$runtime_root/codex-home"
          mkdir -p "$home" "$codex_home" "$runtime_root/tmp"
          attached_devices=()
          attached_mounts=()
          pid=""
          cleanup() {
            set +e
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            for mount in "${attached_mounts[@]}"; do
              [[ -n "$mount" ]] || continue
              hdiutil detach "$mount" -quiet || hdiutil detach "$mount" -force -quiet || true
            done
            for device in "${attached_devices[@]}"; do
              [[ -n "$device" ]] || continue
              hdiutil detach "$device" -quiet || hdiutil detach "$device" -force -quiet || true
            done
          }
          trap cleanup EXIT INT TERM

          attach_plist="$runtime_root/attach.plist"
          attach_status=0
          hdiutil attach -plist -nobrowse -readonly "$asset" > "$attach_plist" || attach_status=$?
          attached_entities="$runtime_root/attach.entities"
          if ! /usr/bin/python3 - "$attach_plist" > "$attached_entities" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              plist = plistlib.load(handle)
          for entity in plist.get("system-entities", []):
              device = entity.get("dev-entry", "")
              mount = entity.get("mount-point", "")
              if device or mount:
                  print(f"{device}\t{mount}")
          PY
          then
            echo 'Unable to parse hdiutil attach plist' >&2
            exit 1
          fi
          while IFS=$'\t' read -r device mount; do
            [[ -n "$device" ]] && attached_devices+=("$device")
            [[ -n "$mount" ]] && attached_mounts+=("$mount")
          done < "$attached_entities"
          if [[ "$attach_status" -ne 0 ]]; then
            echo "hdiutil attach failed with status $attach_status" >&2
            exit "$attach_status"
          fi
          mount_count="${#attached_mounts[@]}"
          if [[ "$mount_count" != 1 ]]; then
            echo "Expected exactly one mounted DMG volume, found $mount_count" >&2
            exit 1
          fi
          mount_point="${attached_mounts[0]}"
          apps=()
          while IFS= read -r app_path; do
            apps+=("$app_path")
          done < <(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print)
          if [[ "${#apps[@]}" -ne 1 ]]; then
            echo "Expected exactly one app bundle in DMG, found ${#apps[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          file "$app/Contents/MacOS/mini-usage" | grep -Eq 'arm64|aarch64'
          if find "$app" -type d -name frontend -print -quit | grep -q .; then
            echo 'DMG app unexpectedly contains a frontend directory' >&2
            exit 1
          fi
          app_copy="$runtime_root/MiniUsage.app"
          ditto "$app" "$app_copy"
          cd "$runtime_root"
          HOME="$home" CODEX_HOME="$codex_home" TMPDIR="$runtime_root/tmp" MINIUSAGE_DISABLE_BROWSER=1 PATH="/usr/bin:/bin" "$app_copy/Contents/MacOS/mini-usage" >"$runtime_root/stdout.log" 2>"$runtime_root/stderr.log" &
          pid=$!
          healthy=0
          expected_binary_version="$CARGO_VERSION"
          health_headers="$runtime_root/health.headers"
          for _ in $(seq 1 120); do
            status="$(curl --silent --output /dev/null --show-error --dump-header "$health_headers" --write-out '%{http_code}' http://127.0.0.1:3210/api/health || true)"
            tr -d '\r' < "$health_headers" > "$runtime_root/health.headers.normalized" 2>/dev/null || true
            if [[ "$status" == '204' ]] && grep -Eiq '^X-MiniUsage-App:[[:space:]]*MiniUsage$' "$runtime_root/health.headers.normalized" && grep -Eiq "^X-MiniUsage-Version:[[:space:]]*$expected_binary_version$" "$runtime_root/health.headers.normalized"; then
              healthy=1
              break
            fi
            sleep 0.25
          done
          if [[ "$healthy" != 1 ]]; then
            cat "$runtime_root/stderr.log" >&2 || true
            echo 'Installed macOS runtime did not pass the health marker/version smoke' >&2
            exit 1
          fi
          if [[ ! -d "$codex_home" || ! -r "$codex_home" ]]; then
            echo "Configured CODEX_HOME is not an existing readable directory: $codex_home" >&2
            exit 1
          fi
          database_dir="$home/Library/Application Support/MiniUsage"
          database_path="$database_dir/mu.sqlite3"
          if [[ ! -d "$database_dir" || ! -f "$database_path" || ! -r "$database_path" ]]; then
            echo "Installed macOS runtime did not create its default database at $database_path" >&2
            exit 1
          fi
          unexpected_database="$(find "$home" -type f -name 'mu.sqlite3' ! -path "$database_path" -print -quit)"
          if [[ -n "$unexpected_database" ]]; then
            echo "Installed macOS runtime created a database outside the isolated default path: $unexpected_database" >&2
            exit 1
          fi

          fetch_document() {
            local url="$1"
            local headers="$2"
            local body="$3"
            local expected_status="$4"
            local status
            status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")"
            if [[ "$status" != "$expected_status" ]]; then
              echo "Unexpected HTTP status $status for $url" >&2
              exit 1
            fi
          }
          header_value() {
            grep -i '^Content-Type:' "$1" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//'
          }

          root_headers="$runtime_root/root.headers"
          root_body="$runtime_root/index.html"
          fetch_document 'http://127.0.0.1:3210/' "$root_headers" "$root_body" 200
          root_type="$(header_value "$root_headers")"
          if [[ "$root_type" != text/html* ]] || [[ ! -s "$root_body" ]] || ! grep -Eiq '<html' "$root_body"; then
            echo 'Installed macOS runtime root did not return a non-empty HTML document' >&2
            exit 1
          fi
          asset_refs=()
          while IFS= read -r asset_ref; do
            asset_refs+=("$asset_ref")
          done < <(grep -oE '(src|href)="[^"]+"' "$root_body" | sed -E 's/^(src|href)="([^"]+)"/\2/' | grep '^/' || true)
          javascript_ref=""
          stylesheet_ref=""
          for asset_ref in "${asset_refs[@]}"; do
            case "$asset_ref" in
              *.js|*.js\?*) [[ -z "$javascript_ref" ]] && javascript_ref="$asset_ref" ;;
              *.css|*.css\?*) [[ -z "$stylesheet_ref" ]] && stylesheet_ref="$asset_ref" ;;
            esac
          done
          if [[ -z "$javascript_ref" || -z "$stylesheet_ref" ]]; then
            echo 'Installed macOS runtime index did not reference both JavaScript and CSS assets' >&2
            exit 1
          fi
          for asset_ref in "$javascript_ref" "$stylesheet_ref"; do
            asset_name="$(printf '%s' "$asset_ref" | tr '/?&=' '____')"
            asset_headers="$runtime_root/$asset_name.headers"
            asset_body="$runtime_root/$asset_name.body"
            fetch_document "http://127.0.0.1:3210$asset_ref" "$asset_headers" "$asset_body" 200
            asset_type="$(header_value "$asset_headers")"
            if [[ ! -s "$asset_body" ]]; then
              echo "Installed macOS runtime asset is empty: $asset_ref" >&2
              exit 1
            fi
            case "$asset_ref" in
              *.js|*.js\?*) [[ "$asset_type" =~ ^(text|application)/javascript ]] || { echo "JavaScript asset has unexpected MIME type $asset_type" >&2; exit 1; } ;;
              *.css|*.css\?*) [[ "$asset_type" =~ ^text/css ]] || { echo "CSS asset has unexpected MIME type $asset_type" >&2; exit 1; } ;;
            esac
          done

          spa_headers="$runtime_root/spa.headers"
          spa_body="$runtime_root/spa.html"
          fetch_document 'http://127.0.0.1:3210/acceptance/spa-route' "$spa_headers" "$spa_body" 200
          if [[ "$(header_value "$spa_headers")" != text/html* ]] || ! grep -Eiq '<html' "$spa_body"; then
            echo 'Installed macOS runtime did not serve the SPA fallback document' >&2
            exit 1
          fi

          api_headers="$runtime_root/api.headers"
          api_body="$runtime_root/api.json"
          fetch_document 'http://127.0.0.1:3210/api/acceptance-not-found' "$api_headers" "$api_body" 404
          if [[ "$(header_value "$api_headers")" != application/json* ]] || ! grep -Eq '"code"[[:space:]]*:[[:space:]]*"NOT_FOUND"' "$api_body"; then
            echo 'Installed macOS runtime unknown API did not return JSON NOT_FOUND' >&2
            exit 1
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          if-no-files-found: error
          path: target/release/MiniUsage-v${{ steps.version.outputs.version }}-macos-arm64.dmg

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust metadata tooling
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify tag and Cargo version before release assets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          cargo_version="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mini-usage"))')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or vX.Y.Z-rc.N, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_base="${BASH_REMATCH[1]}"
          tag_suffix="${BASH_REMATCH[2]-}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_base" != "$cargo_version" ]]; then
            echo "Release tag base $tag_base does not match Cargo package version $cargo_version" >&2
            exit 1
          fi
          is_candidate=false
          if [[ -n "$tag_suffix" ]]; then
            is_candidate=true
          fi
          if [[ "$is_candidate" == false && "$tag_version" != "$cargo_version" ]]; then
            echo "Stable release tag $GITHUB_REF_NAME must exactly match v$cargo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"
          printf 'cargo_version=%s\n' "$cargo_version" >> "$GITHUB_OUTPUT"
          printf 'is_candidate=%s\n' "$is_candidate" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$tag_version" >> "$GITHUB_ENV"
          printf 'TAG_VERSION=%s\n' "$tag_version" >> "$GITHUB_ENV"
          printf 'CARGO_VERSION=%s\n' "$cargo_version" >> "$GITHUB_ENV"
          printf 'IS_CANDIDATE=%s\n' "$is_candidate" >> "$GITHUB_ENV"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: staging/windows

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: staging/macos

      - name: Validate assets and create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          windows_name="MiniUsage-v${version}-windows-x64-setup.exe"
          macos_name="MiniUsage-v${version}-macos-arm64.dmg"
          windows_path="$(find staging/windows -type f -name "$windows_name" -print -quit)"
          macos_path="$(find staging/macos -type f -name "$macos_name" -print -quit)"
          [[ -n "$windows_path" && -n "$macos_path" ]]
          [[ "$(find staging/windows -type f | wc -l | tr -d ' ')" == 1 ]]
          [[ "$(find staging/macos -type f | wc -l | tr -d ' ')" == 1 ]]
          mkdir -p release-assets
          cp "$windows_path" "release-assets/$windows_name"
          cp "$macos_path" "release-assets/$macos_name"
          (cd release-assets && sha256sum "$windows_name" "$macos_name" > SHA256SUMS.txt)
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          [[ "$(wc -l < release-assets/SHA256SUMS.txt | tr -d ' ')" == 2 ]]
          [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == 3 ]]

      - name: Publish validated release with GitHub token
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          is_candidate="${{ steps.version.outputs.is_candidate }}"
          release_args=(--verify-tag)
          if [[ "$is_candidate" == true ]]; then
            release_args+=(--draft --prerelease)
          elif [[ "$is_candidate" != false ]]; then
            echo "Unexpected candidate state: $is_candidate" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/MiniUsage-v${version}-windows-x64-setup.exe" \
            "release-assets/MiniUsage-v${version}-macos-arm64.dmg" \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "MiniUsage $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_args[@]}"
