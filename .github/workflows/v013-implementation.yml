name: v0.1.3 Implementation Runner

on:
  push:
    branches:
      - release/v0.1.3
    paths:
      - '.github/scripts/v013-implement.py'
      - '.github/scripts/v013-hotfix.py'
      - '.github/scripts/v013-hotfix2.py'
      - '.github/workflows/v013-implementation.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply, verify, and persist result
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/v013-run.log"
          : > "$log"
          git rm -f --ignore-unmatch .github/v013-failure.log >/dev/null 2>&1 || true
          run_step() {
            name="$1"; shift
            echo "===== $name =====" | tee -a "$log"
            "$@" >> "$log" 2>&1
            return $?
          }
          status=0
          run_step hotfix python3 .github/scripts/v013-hotfix.py || status=$?
          if [[ $status -eq 0 ]]; then run_step implement python3 .github/scripts/v013-implement.py || status=$?; fi
          if [[ $status -eq 0 ]]; then run_step hotfix2 python3 .github/scripts/v013-hotfix2.py || status=$?; fi
          if [[ $status -eq 0 ]]; then run_step rustfmt cargo fmt || status=$?; fi
          if [[ $status -eq 0 ]]; then (cd frontend && npm ci) >> "$log" 2>&1 || status=$?; fi
          if [[ $status -eq 0 ]]; then (cd frontend && npm test) >> "$log" 2>&1 || status=$?; fi
          if [[ $status -eq 0 ]]; then (cd frontend && npm run check) >> "$log" 2>&1 || status=$?; fi
          if [[ $status -eq 0 ]]; then (cd frontend && npm run build) >> "$log" 2>&1 || status=$?; fi
          if [[ $status -eq 0 ]]; then run_step cargo-check cargo check --locked || status=$?; fi
          if [[ $status -eq 0 ]]; then run_step cargo-test cargo test --locked || status=$?; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ $status -ne 0 ]]; then
            cp "$log" .github/v013-failure.log
            git add .github/v013-failure.log
            git commit -m 'chore: capture v0.1.3 implementation failure [skip ci]' || true
            git push origin HEAD:release/v0.1.3
            tail -n 240 "$log"
            exit "$status"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: implement v0.1.3 dashboard analytics [skip ci]'
          git push origin HEAD:release/v0.1.3
          tail -n 120 "$log"
