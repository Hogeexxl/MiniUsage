name: Branch FINAL evidence

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

jobs:
  clippy-quality:
    if: "${{ github.event.head_commit.message == 'chore: run branch final evidence' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Execute formal Clippy command
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
      - name: Record formal command outcome
        shell: bash
        run: |
          echo "formal_clippy_outcome=${{ steps.clippy.outcome }}"
          echo "A failing formal command requires baseline/new-warning classification; it is not silently treated as clean."

  resource-p2:
    if: "${{ github.event.head_commit.message == 'chore: run branch final evidence' }}"
    name: Resource P2 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Windows x64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw "Expected AMD64" }
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Run affected chunk-reader RSS resource P2
        run: cargo test --locked t_s04_052_one_gib_bounded_reader_keeps_batches_and_process_memory_bounded -- --ignored --nocapture
