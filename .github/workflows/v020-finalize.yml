name: v0.2.0 finalize patch

on:
  push:
    branches:
      - agent/v0.2.0-beui-redesign
    paths:
      - .github/workflows/v020-finalize.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v020-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/v0.2.0-beui-redesign' || github.ref_name == 'agent/v0.2.0-beui-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.2.0-beui-redesign
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact finalize patch
        run: python tools/v020_finalize_patch.py
      - name: Commit finalized contracts and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(v0.2.0): finalize sort contract and manifests"
          git push origin HEAD:agent/v0.2.0-beui-redesign
