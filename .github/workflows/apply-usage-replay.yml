name: Apply usage replay continuation

on:
  push:
    branches:
      - fix/windows-fork-session-resilience

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run usage replay patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-fork-session-resilience
          fetch-depth: 0
      - name: Normalize guarded patch pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_usage_replay_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '            && !matches!(self.context.resume_state, ResumeState::ReplayedAncestor { .. })\n'
          new = '''            && !matches!(
                          self.context.resume_state,
                          ResumeState::ReplayedAncestor { .. }
                      )
          '''
          if old not in text:
              raise SystemExit('patch guard source shape not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply guarded patch
        run: python tools/apply_usage_replay_patch.py
      - name: Format
        run: cargo fmt
      - name: Compile and run focused tests
        run: |
          cargo check --locked
          cargo test --locked usage::pipeline::tests
          cargo test --locked codex::rollout::tests
          cargo test --locked storage::migrations::tests
          cargo test --locked scanner::tests
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-usage-replay.yml
          rm -f tools/apply_usage_replay_patch.py
          git add -A
          git commit -m "fix: persist usage replay continuation"
          git push origin HEAD:fix/windows-fork-session-resilience
